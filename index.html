<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة العائلة! 👶🍼</title>
    <!-- Tailwind CSS for layout and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal for elegant Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for celebration effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Animated pastel gradient background */
            background: linear-gradient(-45deg, #ffe4e1, #e0f7fa, #fffacd, #f0e6fa);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating background items (toys, bottles, hearts) */
        .floating-item {
            position: absolute;
            font-size: 2rem;
            opacity: 0.4;
            animation: floatup 10s infinite linear;
            z-index: 0;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatup {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Main Card Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 0 0 2px rgba(255,255,255,0.5);
            z-index: 10;
            transform: translateY(20px);
            opacity: 0;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Pregnancy Test Stick Styling */
        .test-stick {
            width: 320px;
            height: 70px;
            background: #ffffff;
            border-radius: 50px;
            box-shadow: inset 0 -4px 10px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            align-items: center;
            border: 2px solid #f3f4f6;
            margin: 0 auto;
            overflow: hidden;
        }

        .test-cap {
            width: 80px;
            height: 100%;
            background: linear-gradient(135deg, #a78bfa, #f472b6); /* Pinkish purple cap */
            border-radius: 0 50px 50px 0; /* Arabic RTL */
            box-shadow: inset -3px 0 6px rgba(0,0,0,0.1);
        }

        .test-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The Screen where lines appear */
        .test-screen {
            width: 90px;
            height: 40px;
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
            position: relative;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            overflow: hidden;
        }

        .liquid-flow {

            left: -100%; /* Start outside */
            top: 0;
